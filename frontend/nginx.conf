server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Docker's resolver, so nginx starts even if the app container is not up yet
    # and follows it when it restarts under a new address.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $backend http://app:8000;
        proxy_pass $backend;
        # the API compares this with the browser's Origin, so the port has to stay
        proxy_set_header Host $http_host;
        # update actions fetch from AUTO.RIA one listing at a time and can take a while
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri /index.html;
    }
}
